<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Personal Web Mood — Settings</title>
    <style>
      body{font-family:Arial;margin:12px}
      label{display:block;margin:8px 0}
      input[type=number]{width:80px}
    </style>
  </head>
  <body>
    <h2>Settings</h2>
    <form id="settings">
      <fieldset style="border:1px solid #ddd;padding:8px;margin-bottom:12px">
        <legend style="font-weight:700">Reminders & New Tab</legend>
        <label>Reminder interval (minutes): <input id="interval" type="number" min="1" /></label>
        <label><input id="newtab" type="checkbox" /> Show map on new tab (requires extension enabled)</label>
        <label><input id="showFloating" type="checkbox" /> Show floating rating button on pages</label>
      </fieldset>

      <fieldset style="border:1px solid #ddd;padding:8px;margin-bottom:12px">
        <legend style="font-weight:700">Search</legend>
        <label>Search engine:
          <select id="searchEngineSelect">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label id="searchCustomWrap" style="display:none;margin-top:6px">Custom search URL (use %s for query): <input id="searchCustomUrl" type="text" style="width:100%"/></label>
      </fieldset>

      <fieldset style="border:1px solid #ddd;padding:8px;margin-bottom:12px">
        <legend style="font-weight:700">Blocked Sites</legend>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="blockInput" type="text" placeholder="example.com" style="flex:1" />
          <button id="addBlockBtn" type="button">Add</button>
        </div>
        <div id="blockedList" style="margin-top:8px"></div>
        <small style="display:block;margin-top:6px;color:#666">Blocked sites are stored in settings and included in backups.</small>
      </fieldset>

      <fieldset style="border:1px solid #ddd;padding:8px;margin-bottom:12px">
        <!-- External sync removed per user request -->

      <div style="margin-top:10px"><button id="save">Save</button></div>
    </form>

    <h3>Backup / Restore</h3>
    <div style="margin-bottom:12px">
      <button id="exportBtn">Export ratings (download JSON)</button>
      <input id="importFile" type="file" accept="application/json" style="display:inline-block;margin-left:8px" />
      <button id="importBtn">Import</button>
    </div>

    <div id="msg" style="margin-top:8px;color:green"></div>
    <script src="options.js"></script>
  </body>
</html>
